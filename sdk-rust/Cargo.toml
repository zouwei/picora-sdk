[package]
name = "picora-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust client SDK for the Picora API (PC-focused subset)."
license = "Apache-2.0"
repository = "https://github.com/zouwei/picora-sdk"
readme = "README.md"

[dependencies]
# Feature set aligned with the Moraya desktop consumer (src-tauri) so Cargo can
# unify reqwest features cleanly: 0.12, default (native-tls) + json + multipart.
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
